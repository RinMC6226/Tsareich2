<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Parliament GUI Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    background: #1a1a2e;
    background-image:
      linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
      repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(255,255,255,0.02) 50px, rgba(255,255,255,0.02) 51px),
      repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(255,255,255,0.02) 50px, rgba(255,255,255,0.02) 51px);
    font-family: 'Segoe UI', sans-serif;
    color: #e0d8c0;
    overflow: hidden;
    position: relative;
  }

  /* HoI4 top bar mockup */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 46px;
    background: linear-gradient(180deg, #2a2a3a 0%, #1e1e2e 100%);
    border-bottom: 2px solid #4a4a5a;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 30px;
    z-index: 5;
  }
  .top-bar .resource { font-size: 13px; color: #c0b890; }
  .top-bar .date { margin-left: auto; font-size: 15px; color: #d4c89a; font-weight: bold; }

  /* HoI4 side tabs mockup */
  .side-tabs {
    position: absolute;
    top: 48px; right: 0;
    width: 48px;
    background: #22222e;
    border-left: 2px solid #3a3a4a;
    height: calc(100% - 48px);
    display: flex;
    flex-direction: column;
    padding-top: 10px;
    gap: 4px;
    z-index: 5;
  }
  .side-tab {
    width: 40px; height: 40px;
    margin: 0 auto;
    background: #2e2e3e;
    border: 1px solid #4a4a5a;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #8888aa;
    cursor: pointer;
  }
  .side-tab:hover { background: #3e3e4e; }

  /* Map area hint */
  .map-hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    color: rgba(255,255,255,0.08);
    letter-spacing: 8px;
  }

  /* Dark overlay when parliament is open */
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 10;
  }

  /* Parliament window */
  .parliament-window {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 820px;
    height: 560px;
    background: linear-gradient(180deg, #1c1c28 0%, #14141e 100%);
    border: 2px solid #5a5a6a;
    border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    z-index: 20;
    display: flex;
    flex-direction: column;
  }

  /* Title bar */
  .title-bar {
    height: 38px;
    background: linear-gradient(180deg, #2e2e42 0%, #24243a 100%);
    border-bottom: 1px solid #4a4a5a;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-radius: 4px 4px 0 0;
  }
  .title-bar h2 {
    font-size: 16px;
    color: #d4c89a;
    font-weight: normal;
    letter-spacing: 2px;
  }
  .close-btn {
    margin-left: auto;
    width: 24px; height: 24px;
    background: #3a2020;
    border: 1px solid #6a3030;
    border-radius: 3px;
    color: #cc6666;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn:hover { background: #5a2020; }

  /* Main content area */
  .parliament-content {
    flex: 1;
    display: flex;
    padding: 12px;
    gap: 12px;
  }

  /* Left: semicircle + bar */
  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Semicircle container */
  .semicircle-container {
    position: relative;
    width: 480px;
    height: 280px;
  }

  .seat {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.4);
  }

  /* Total seats text */
  .total-seats {
    margin-top: 4px;
    font-size: 18px;
    color: #d4c89a;
    text-align: center;
  }
  .total-seats .number { font-size: 28px; font-weight: bold; }

  /* Summary bar */
  .summary-bar {
    width: 460px;
    height: 18px;
    display: flex;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
    border: 1px solid #3a3a4a;
  }
  .bar-segment {
    height: 100%;
    transition: width 0.3s;
  }

  /* Right: party list */
  .right-panel {
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }

  .party-entry {
    display: flex;
    align-items: center;
    padding: 6px 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 3px;
    gap: 8px;
    cursor: default;
  }
  .party-entry:hover {
    background: rgba(255,255,255,0.07);
  }

  .party-color-bar {
    width: 5px;
    height: 48px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .party-info {
    flex: 1;
    min-width: 0;
  }
  .party-name {
    font-size: 13px;
    color: #d4c89a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .party-seats {
    font-size: 12px;
    color: #9090a0;
    margin-top: 1px;
  }
  .party-leader {
    font-size: 11px;
    color: #707080;
    margin-top: 1px;
    font-style: italic;
  }

  .party-pct {
    font-size: 14px;
    font-weight: bold;
    color: #b0a880;
    flex-shrink: 0;
    width: 38px;
    text-align: right;
  }
</style>
</head>
<body>

<!-- HoI4-like top bar -->
<div class="top-bar">
  <span class="resource">PP: 150</span>
  <span class="resource">Stability: 65%</span>
  <span class="resource">War Support: 40%</span>
  <span class="resource">Manpower: 2.4M</span>
  <span class="date">1936.1.1</span>
</div>

<!-- Side tabs -->
<div class="side-tabs">
  <div class="side-tab">Pol</div>
  <div class="side-tab">Dip</div>
  <div class="side-tab">Mil</div>
  <div class="side-tab">Tec</div>
  <div class="side-tab">Pro</div>
  <div class="side-tab">Log</div>
</div>

<div class="map-hint">MAP AREA</div>

<!-- Dark overlay -->
<div class="overlay"></div>

<!-- Parliament window -->
<div class="parliament-window">
  <div class="title-bar">
    <h2>REICHSTAG</h2>
    <div class="close-btn">X</div>
  </div>

  <div class="parliament-content">
    <div class="left-panel">
      <div class="semicircle-container" id="semicircle"></div>
      <div class="total-seats"><span class="number">397</span> Sitze</div>
      <div class="summary-bar" id="summaryBar"></div>
    </div>

    <div class="right-panel" id="partyList"></div>
  </div>
</div>

<script>
const parties = [
  { name: "Kommunistische Partei Deutschlands",  seats: 16,  pct: 4,  color: "rgb(139,0,0)",      leader: "Ernst Thalmann" },
  { name: "SAPD",                                 seats: 44,  pct: 11, color: "rgb(186,36,68)",     leader: "Paul Levi" },
  { name: "Sozialdemokratische Partei",            seats: 83,  pct: 21, color: "rgb(214,96,152)",    leader: "Otto Wels" },
  { name: "Fortschrittliche Volkspartei",          seats: 56,  pct: 14, color: "rgb(212,132,32)",    leader: "Friedrich Naumann" },
  { name: "Zentrumspartei",                        seats: 63,  pct: 16, color: "rgb(120,168,196)",   leader: "Ludwig Kaas" },
  { name: "Konservatives Block",                   seats: 115, pct: 29, color: "rgb(92,118,148)",    leader: "Kuno von Westarp" },
  { name: "DNVP",                                  seats: 20,  pct: 5,  color: "rgb(42,48,80)",      leader: "Alfred Hugenberg" },
];

// Generate semicircle seats
const container = document.getElementById('semicircle');
const rows = [
  { count: 28, radius: 105 },
  { count: 33, radius: 135 },
  { count: 39, radius: 165 },
];
const centerX = 240;
const centerY = 270;
const totalSeats = 100;

// Build seat-to-party mapping
let seatColors = [];
for (const p of parties) {
  const icons = Math.round(p.pct);
  for (let j = 0; j < icons; j++) seatColors.push(p.color);
}
while (seatColors.length < totalSeats) seatColors.push(parties[parties.length - 1].color);
while (seatColors.length > totalSeats) seatColors.pop();

let seatIdx = 0;
for (const row of rows) {
  for (let i = 0; i < row.count; i++) {
    const angle = Math.PI * (i + 0.5) / row.count;
    const x = centerX - row.radius * Math.cos(angle);
    const y = centerY - row.radius * Math.sin(angle);
    const seat = document.createElement('div');
    seat.className = 'seat';
    seat.style.left = x + 'px';
    seat.style.top = y + 'px';
    seat.style.backgroundColor = seatColors[seatIdx] || '#333';
    container.appendChild(seat);
    seatIdx++;
  }
}

// Summary bar
const bar = document.getElementById('summaryBar');
for (const p of parties) {
  const seg = document.createElement('div');
  seg.className = 'bar-segment';
  seg.style.width = p.pct + '%';
  seg.style.backgroundColor = p.color;
  bar.appendChild(seg);
}

// Party list
const list = document.getElementById('partyList');
for (const p of parties) {
  const entry = document.createElement('div');
  entry.className = 'party-entry';
  entry.innerHTML = `
    <div class="party-color-bar" style="background:${p.color}"></div>
    <div class="party-info">
      <div class="party-name">${p.name}</div>
      <div class="party-seats">${p.seats} Sitze</div>
      <div class="party-leader">${p.leader}</div>
    </div>
    <div class="party-pct">${p.pct}%</div>
  `;
  list.appendChild(entry);
}
</script>
</body>
</html>
