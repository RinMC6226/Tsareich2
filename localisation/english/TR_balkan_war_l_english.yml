l_english:
 tsr_balkan_war.1.t: "Balkan Border Incident"
 tsr_balkan_war.1.d: "Armed clashes have broken out along the Hungarian-Yugoslav border. Protests against the repression of Serb residents in Vojvodina have turned violent and escalated into firefights between border guards."
 tsr_balkan_war.1.a: "Strengthen the border guard"
 tsr_balkan_war.2.t: "Declaration of War on Hungary"
 tsr_balkan_war.2.d: "We can no longer endure these clashes on the border. Hungary continues to oppress our compatriots. With Russian support behind us, the time has come for a solution by force."
 tsr_balkan_war.2.a: "Declare war on Hungary"
 tsr_balkan_war.3.t: "Yugoslavia Declares War!"
 tsr_balkan_war.3.d: "Yugoslavia has declared war on our country. Enemy forces have begun invading from the southern border. We must defend the fatherland."
 tsr_balkan_war.3.a: "Defend the fatherland!"
 tsr_balkan_war.4.t: "Support for Hungary"
 tsr_balkan_war.4.d: "In the Balkan proxy war, Hungary, within our sphere of influence, is in danger. We should dispatch equipment and military advisers to preserve German influence. Repayment of the loan can be demanded after the war."
 tsr_balkan_war.4.a: "Grant Hungary a loan"
 tsr_balkan_war.5.t: "Support for Yugoslavia"
 tsr_balkan_war.5.d: "Our friendly state Yugoslavia is at war with Hungary in the Balkans. We should send equipment and aid in the form of a wartime loan and expand Russian influence."
 tsr_balkan_war.5.a: "Support Yugoslavia"
 tsr_balkan_war.6.t: "Aid from Germany"
 tsr_balkan_war.6.d: "The German Empire has sent equipment and military advisers to our country as a military loan. We must repay this support after the war, but survival comes first."
 tsr_balkan_war.6.a: "Thank Germany for its support"
 tsr_balkan_war.7.t: "Aid from Russia"
 tsr_balkan_war.7.d: "The Russian Empire has promised military aid to our country as a wartime loan. Equipment and advisers have begun to arrive, though this support is not free."
 tsr_balkan_war.7.a: "Thank Russia for its support"
 tsr_balkan_war.8.t: "Opportunity to Recover Transylvania"
 tsr_balkan_war.8.d: "Now that Hungary is exhausted by its war with Yugoslavia, we have a perfect opportunity to recover all of Transylvania, including Szekely Land."
 tsr_balkan_war.8.a: "Join the war on Yugoslavia's side"
 tsr_balkan_war.9.t: "Romania Joins the War!"
 tsr_balkan_war.9.d: "Romania has joined the war on Yugoslavia's side. Romanian forces are now invading from the eastern border as well, forcing us into a two-front war."
 tsr_balkan_war.9.a: "The situation is grim..."
 tsr_balkan_war.10.t: "Subversive Operations"
 tsr_balkan_war.10.d: ""
 tsr_balkan_war.10.a: "Understood"
 tsr_balkan_war.11.t: "Minority Uprisings"
 tsr_balkan_war.11.d: "Yugoslav operations have triggered simultaneous uprisings by Slovaks, Ruthenians, and the people of Banat. Independence has been declared across the country, and the state is collapsing from within."
 tsr_balkan_war.11.a: "We have been betrayed!"
 tsr_balkan_war.12.t: "Independence of the Banat Republic"
 tsr_balkan_war.12.d: "The people of Banat have broken free from Hungarian rule and declared independence as the Banat Republic. A new republic is born."
 tsr_balkan_war.12.a: "We have won freedom!"
 tsr_balkan_war.13.t: "Independence of Slovakia"
 tsr_balkan_war.13.d: "The Slovaks have broken free from Hungarian rule and established an independent state. Their long-cherished wish has been fulfilled."
 tsr_balkan_war.13.a: "Glory to Slovakia!"
 tsr_balkan_war.14.t: "Independence of Carpatho-Ukraine"
 tsr_balkan_war.14.d: "The Ruthenians of the Carpathians have declared independence from Hungary. A small but free country is born."
 tsr_balkan_war.14.a: "The beginning of a new nation!"
 tsr_balkan_war.15.t: "End of the Balkan War"
 tsr_balkan_war.15.d: "The war is over. Hungary has lost vast territories and the map of the Balkans has been redrawn. Only Budapest and its surroundings remain."
 tsr_balkan_war.15.a: "Accept the peace terms"
 tsr_balkan_war.16.t: "Victory in the Balkan War"
 tsr_balkan_war.16.d: "The Balkan War has ended in our victory. Vojvodina has been liberated, but our wartime debt to Russia weighs heavily upon us. Victory has not come cheaply."
 tsr_balkan_war.16.a: "Victory, but at a cost..."
 tsr_balkan_war.17.t: "Recovery of Transylvania"
 tsr_balkan_war.17.d: "As a result of the Balkan War, Romania has recovered all of Transylvania, including Szekely Land. The dream of Greater Romania has been fulfilled."
 tsr_balkan_war.17.a: "Greater Romania is complete!"
 tsr_german_proxy_support: "German Military Support"
 tsr_german_proxy_support_desc: "The German Empire is sending equipment and military advisers to our country during the Balkan War."
 tsr_russian_war_loan: "Wartime Loan from Russia"
 tsr_russian_war_loan_desc: "We are receiving equipment and military support from the Russian Empire as a wartime loan. This support must be repaid after the war."
 tsr_transylvania_irredentism: "Transylvanian Irredentism"
 tsr_transylvania_irredentism_desc: "The recovery of all Transylvania is the cherished wish of our people. Now is the time."
 tsr_balkan_war_exhaustion: "Balkan War Exhaustion"
 tsr_balkan_war_exhaustion_desc: "After a devastating defeat in the Balkan War, the nation is exhausted and thrown into political chaos."
 tsr_yug_war_debt: "Wartime Debt to Russia"
 tsr_yug_war_debt_desc: "Victory in the Balkan War was made possible by wartime loans from Russia. Their repayment is straining the national finances."
 tsr_balkan_entente: "Balkan Entente"
 tsr_hun_multiethnic_army: "Multiethnic Army"
 tsr_hun_multiethnic_army_desc: "Hungary is a multiethnic state and recruits soldiers even from residents of non-core states."
 tsr_balkan_war.100.t: "The Balkan War Begins!"
 tsr_balkan_war.100.d: "Yugoslavia has declared war on Hungary. A major war has erupted in the Balkans and is taking on the character of a proxy war between Germany and Russia. The balance of power in Europe may be shaken."
 tsr_balkan_war.100.a: "Justice is with us!"
 tsr_balkan_war.100.b: "Repel the aggressor!"
 tsr_balkan_war.100.c: "The Balkan situation is tense..."
 tsr_balkan_war.101.t: "Romania Joins the Balkan War"
 tsr_balkan_war.101.d: "Romania has declared war on Hungary as a member of the Balkan Entente. Romanian forces, proclaiming the recovery of Transylvania, have begun their advance from the east and Hungary is now forced into a two-front war."
 tsr_balkan_war.101.a: "Take back Transylvania!"
 tsr_balkan_war.101.b: "We stand alone..."
 tsr_balkan_war.101.c: "The expansion of the war is alarming"
 tsr_balkan_war.102.t: "End of the Balkan War"
 tsr_balkan_war.102.d: "The Balkan War has finally ended. Hungary has lost vast territories, while Slovakia, Carpatho-Ukraine, and Banat have emerged as independent states. Vojvodina has been transferred to Yugoslavia and Transylvania to Romania. The former Kingdom of Hungary is now a shadow of itself."
 tsr_balkan_war.102.a: "A new Balkan order"
 tsr_balkan_war.102.b: "A humiliating peace..."
 tsr_balkan_war.102.c: "The map of the Balkans has been redrawn"
 tsr_balkan_war.18.t: "Banat Partition Agreement"
 tsr_balkan_war.18.d: "The time has come to conclude a partition agreement with Romania over the Banat Republic, which became independent after the Balkan War. Western Banat has many Serb residents and should pass to us, while eastern Banat has many Romanian residents and should pass to Romania."
 tsr_balkan_war.18.a: "Partition Banat"
 tsr_balkan_war.19.t: "Banat Partition Agreement"
 tsr_balkan_war.19.d: "The partition agreement over Banat with Yugoslavia has been concluded. Eastern Banat, including Timisoara, will become Romanian territory."
 tsr_balkan_war.19.a: "Timisoara is ours"
 tsr_balkan_war.103.t: "Partition of Banat"
 tsr_balkan_war.103.d: "The Banat Republic, independent after the Balkan War, has been partitioned by Yugoslavia and Romania. Western Banat has been incorporated into Yugoslavia, while eastern Banat, including Timisoara, has been incorporated into Romania."
 tsr_balkan_war.103.a: "This contributes to Balkan stability"
 tsr_balkan_war.103.b: "Another country has disappeared..."
 tsr_balkan_war.20.t: "Repayment of the German Loan"
 tsr_balkan_war.20.d: "The war is over, but there is no prospect of repaying our loan to Germany. Having lost most of our territory, our country no longer has the capacity to pay. Germany demands the cession of Burgenland, with its large German population, as compensation."
 tsr_balkan_war.20.a: "There is no choice... cede Burgenland"
 tsr_balkan_war.21.t: "Acquisition of Burgenland"
 tsr_balkan_war.21.d: "Hungary, unable to repay its wartime loan, has ceded Burgenland. This region, with its large German population, will rightfully be incorporated into the German Empire."
 tsr_balkan_war.21.a: "A natural consequence"
 tsr_balkan_war.22.t: "Monitoring the Peace Terms"
 tsr_balkan_war.22.d: ""
 tsr_balkan_war.22.a: "Understood"
