 GER_parliament: "Reichstag"
 GER_parliament_desc: "The German Reichstag is the national representative body of the German Empire, established in 1871, and participates in imperial legislation together with the Bundesrat. Its deputies are elected by universal, equal, direct, and secret suffrage among male subjects aged 25 and over. Since 1888 its term has been five years."

