l_english:
 SPR_GATHERING_STORM_DESC: "The People's Republic of Spain has passed through civil war and the age of monarchy to stand on the Iberian Peninsula as a revolutionary state. Yet the new regime remains fragile, burdened with economic reconstruction, military reorganization, and the fate of the European revolution. To defend the ideals of its comrades, Spain must once again advance to the front line of history."
 ITA_GATHERING_STORM_DESC: "The Italian Socialist Republic has overthrown the old order and raised a new banner over the Mediterranean as a workers' state. Yet remnants of the former ruling class, the divide between north and south, and disputes over the direction of the revolution remain. Whether the transformation begun in Rome can shake Europe now depends on the choices ahead."
 FRA_GATHERING_STORM_DESC: "The Union of French Communes has overcome the humiliation of defeat and social division to begin anew under a revolutionary government. Yet victorious Germany lies to the east, an unstable Atlantic order lies to the west, and tensions between army and party, city and countryside remain at home. Revolutionary France must do more than survive; it must advance with the future of Europe itself at stake."
 GER_GATHERING_STORM_DESC: "Victorious in the First World War, the German Empire built a continental European order around its alliance with Russia. As a victor it wields great influence across the continent, but victory did not promise eternal stability. Red France, Italy, and Spain line the west, while Britain burns with ambition to restore its lost prestige. Germany, now a winner, must preserve its alliances and spheres of influence, confront domestic problems, and rise once more to defend its victory."
 RUS_GATHERING_STORM_DESC: "The Russian Empire won the Great War together with Germany, repelled revolution, and preserved the throne of the Tsar. Victory spared the empire from collapse, but within its vast territory remain delayed modernization, national questions, rural stagnation, and an old bureaucracy. Communism spreads in Western Europe, and Britain too dreams of imperial revival. Russia, a victorious yet unstable giant, must preserve the authority of the Tsar while finding a form worthy of a new age."
