l_japanese:
 GER_parliament: "帝国議会"
 GER_parliament_desc: "ドイツ帝国議会は、1871年に成立したドイツ帝国の国民代表機関であり、連邦参議院とともに帝国の立法に関与している。議員は満25歳以上の男子臣民による普通・平等・直接・秘密選挙で選出され、1888年以降の任期は5年である。帝国議会は法律案の審議と国家予算の承認を通じて、連邦国家としてのドイツ帝国の法制度と財政運営を支える重要な機関となっている。"

