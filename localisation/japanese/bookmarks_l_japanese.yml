l_japanese:
 GER_GATHERING_STORM_DESC: "第一次世界大戦に勝利したドイツ帝国は、ロシアとの同盟を軸に欧州大陸の秩序を築いた。帝国は戦勝国として大陸に強い影響力を持つが、その勝利は永遠の安定を約束するものではなかった。赤化したフランス、イタリア、スペインが西方に並び、英国は失われた威信を取り戻すため帝国再興の野心を燃やしている。勝者となったドイツは、同盟と勢力圏を維持し、国内の課題に向き合いながら、今やその勝利を守るために再び立ち上がらねばならない。"
 RUS_GATHERING_STORM_DESC: "ドイツと共に大戦を制したロシア帝国は、革命を退け、ツァーリの玉座を守り抜いた。勝利によって帝国は崩壊を免れたが、その広大な領土の内側には近代化の遅れ、民族問題、農村の停滞、そして旧来の官僚制度が残されている。西欧では共産主義が勢力を広げ、英国もまた帝国再興の野心を燃やしている。戦勝国でありながら不安定な巨人であるロシアは、ツァーリの権威を保ちながら、新たな時代にふさわしい姿を見出さねばならない。"
