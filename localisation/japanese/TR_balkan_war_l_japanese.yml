l_japanese:
 tsr_balkan_war.1.t: "バルカン国境事変"
 tsr_balkan_war.1.d: "ハンガリーとユーゴスラビアの国境で武力衝突が発生した。ヴォイヴォディナのセルビア系住民への弾圧に対する抗議が暴力化し、国境警備隊同士の銃撃戦に発展している。"
 tsr_balkan_war.1.a: "国境警備を強化する"
 tsr_balkan_war.2.t: "ハンガリーへの宣戦布告"
 tsr_balkan_war.2.d: "国境での衝突がこれ以上続くのは耐えられない。ハンガリーは我が同胞を弾圧し続けている。ロシアの支援を背景に、武力による解決の時が来た。"
 tsr_balkan_war.2.a: "ハンガリーに宣戦布告する"
 tsr_balkan_war.3.t: "ユーゴスラビアが宣戦布告！"
 tsr_balkan_war.3.d: "ユーゴスラビアが我が国に宣戦布告した。南部国境から敵軍が侵攻を開始している。我々は祖国を守らねばならない。"
 tsr_balkan_war.3.a: "祖国を守れ！"
 tsr_balkan_war.4.t: "ハンガリーへの支援"
 tsr_balkan_war.4.d: "バルカンでの代理戦争において、我が影響圏のハンガリーは危機に瀕している。装備と軍事顧問を派遣し、ドイツの影響力を維持すべきである。借款の返済は戦後に求めればよい。"
 tsr_balkan_war.4.a: "ハンガリーに借款を与える"
 tsr_balkan_war.5.t: "ユーゴスラビアへの支援"
 tsr_balkan_war.5.d: "バルカンにおける我が友好国ユーゴスラビアがハンガリーと戦争状態にある。戦時借款の形で装備と支援を送り、ロシアの影響力を拡大すべきである。"
 tsr_balkan_war.5.a: "ユーゴスラビアを支援する"
 tsr_balkan_war.6.t: "ドイツからの支援"
 tsr_balkan_war.6.d: "ドイツ帝国が我が国に軍事借款として装備と軍事顧問を派遣した。この支援は戦後に返済しなければならないが、今は生き残ることが先決だ。"
 tsr_balkan_war.6.a: "ドイツの支援に感謝する"
 tsr_balkan_war.7.t: "ロシアからの支援"
 tsr_balkan_war.7.d: "ロシア帝国が我が国に戦時借款として軍事支援を約束した。装備と軍事顧問が到着し始めている。ただし、この支援は無償ではない。"
 tsr_balkan_war.7.a: "ロシアの支援に感謝する"
 tsr_balkan_war.8.t: "トランシルヴァニア回復の好機"
 tsr_balkan_war.8.d: "ハンガリーがユーゴスラビアとの戦争で疲弊している今こそ、セーケイ地方を含む全トランシルヴァニアを回復する絶好の機会である。"
 tsr_balkan_war.8.a: "ユーゴスラビア側で参戦する"
 tsr_balkan_war.9.t: "ルーマニアが参戦！"
 tsr_balkan_war.9.d: "ルーマニアがユーゴスラビア側で参戦した。東部国境からもルーマニア軍が侵攻を開始している。我が国は二正面の戦争を強いられることになった。"
 tsr_balkan_war.9.a: "状況は厳しい..."
 tsr_balkan_war.10.t: "離間工作"
 tsr_balkan_war.10.d: ""
 tsr_balkan_war.10.a: "了解"
 tsr_balkan_war.11.t: "少数民族の蜂起"
 tsr_balkan_war.11.d: "ユーゴスラビアの工作活動により、スロヴァキア人、ルテニア人、バナト地方の住民が一斉に蜂起した。各地で独立宣言が行われ、国家は内部から崩壊しつつある。"
 tsr_balkan_war.11.a: "我々は裏切られた！"
 tsr_balkan_war.12.t: "バナト共和国の独立"
 tsr_balkan_war.12.d: "バナト地方の住民がハンガリーの支配を脱し、バナト共和国として独立を宣言した。新たな共和国が誕生する。"
 tsr_balkan_war.12.a: "自由を手に入れた！"
 tsr_balkan_war.13.t: "スロヴァキアの独立"
 tsr_balkan_war.13.d: "スロヴァキア人がハンガリーの支配を脱し、独立国家を樹立した。長年の念願が叶った。"
 tsr_balkan_war.13.a: "スロヴァキアに栄光あれ！"
 tsr_balkan_war.14.t: "カルパト・ウクライナの独立"
 tsr_balkan_war.14.d: "カルパト山脈のルテニア人がハンガリーからの独立を宣言した。小さいながらも自由な国が誕生する。"
 tsr_balkan_war.14.a: "新たな国の始まり！"
 tsr_balkan_war.15.t: "バルカン戦争の終結"
 tsr_balkan_war.15.d: "戦争は終わった。ハンガリーは大幅な領土を失い、バルカンの地図は書き換えられた。残されたのはブダペストとその周辺のみである。"
 tsr_balkan_war.15.a: "和平条件を受け入れる"
 tsr_balkan_war.16.t: "バルカン戦争の勝利"
 tsr_balkan_war.16.d: "バルカン戦争は我が国の勝利に終わった。ヴォイヴォディナは解放された。しかし、ロシアへの戦時債務が重くのしかかる。勝利の代償は小さくない。"
 tsr_balkan_war.16.a: "勝利、しかし代償も..."
 tsr_balkan_war.17.t: "トランシルヴァニアの回復"
 tsr_balkan_war.17.d: "バルカン戦争の結果、ルーマニアはセーケイ地方を含む全トランシルヴァニアを回復した。大ルーマニアの悲願が達成された。"
 tsr_balkan_war.17.a: "大ルーマニアの完成！"
 tsr_german_proxy_support: "ドイツの軍事支援"
 tsr_german_proxy_support_desc: "ドイツ帝国がバルカン戦争において我が国に装備と軍事顧問を派遣している。"
 tsr_russian_war_loan: "ロシアからの戦時借款"
 tsr_russian_war_loan_desc: "ロシア帝国から戦時借款として装備と軍事支援を受けている。この支援は戦後に返済しなければならない。"
 tsr_transylvania_irredentism: "トランシルヴァニア回復運動"
 tsr_transylvania_irredentism_desc: "全トランシルヴァニアの回復は我が国民の悲願である。今こそその時だ。"
 tsr_balkan_war_exhaustion: "バルカン戦争の疲弊"
 tsr_balkan_war_exhaustion_desc: "バルカン戦争で壊滅的な敗北を喫し、国家は疲弊し政治的混乱に陥っている。"
 tsr_yug_war_debt: "ロシアへの戦時債務"
 tsr_yug_war_debt_desc: "バルカン戦争での勝利はロシアからの戦時借款によるものだった。その返済が国家財政を圧迫している。"
 tsr_balkan_entente: "バルカン協商"
 tsr_hun_multiethnic_army: "多民族軍"
 tsr_hun_multiethnic_army_desc: "ハンガリーは多民族国家であり、非中核州の住民からも兵士を徴用している。"
 tsr_balkan_war.100.t: "バルカン戦争勃発！"
 tsr_balkan_war.100.d: "ユーゴスラビアがハンガリーに宣戦布告した。バルカン半島で大規模な戦争が勃発し、ドイツとロシアの代理戦争の様相を呈している。欧州の勢力均衡が大きく揺らぎかねない事態である。"
 tsr_balkan_war.100.a: "正義は我らにあり！"
 tsr_balkan_war.100.b: "侵略者を撃退する！"
 tsr_balkan_war.100.c: "バルカンの情勢は緊迫している..."
 tsr_balkan_war.101.t: "ルーマニア、バルカン戦争に参戦"
 tsr_balkan_war.101.d: "ルーマニアがバルカン協商の一員としてハンガリーに宣戦布告した。トランシルヴァニアの回復を掲げるルーマニア軍が東部から侵攻を開始し、ハンガリーは二正面作戦を強いられることになった。"
 tsr_balkan_war.101.a: "トランシルヴァニアを取り戻す！"
 tsr_balkan_war.101.b: "我が国は孤立無援だ..."
 tsr_balkan_war.101.c: "戦争の拡大は憂慮すべきだ"
 tsr_balkan_war.102.t: "バルカン戦争終結"
 tsr_balkan_war.102.d: "バルカン戦争がついに終結した。ハンガリーは大幅な領土を失い、スロヴァキア、カルパト・ウクライナ、バナトが独立国家として誕生した。ヴォイヴォディナはユーゴスラビアに、トランシルヴァニアはルーマニアに移譲された。かつてのハンガリー王国はその影すら留めていない。"
 tsr_balkan_war.102.a: "新たなバルカンの秩序だ"
 tsr_balkan_war.102.b: "屈辱的な講和だ..."
 tsr_balkan_war.102.c: "バルカンの地図が書き換えられた"
 tsr_balkan_war.18.t: "バナト分割協定"
 tsr_balkan_war.18.d: "バルカン戦争の結果独立したバナト共和国について、ルーマニアと分割協定を結ぶ時が来た。西バナトはセルビア系住民が多く我が国が取得し、東バナトはルーマニア系住民が多くルーマニアに渡すのが妥当だろう。"
 tsr_balkan_war.18.a: "バナトを分割する"
 tsr_balkan_war.19.t: "バナト分割協定"
 tsr_balkan_war.19.d: "ユーゴスラビアとのバナト分割協定が成立した。ティミショアラを含む東バナトはルーマニア領となる。"
 tsr_balkan_war.19.a: "ティミショアラは我らのものだ"
 tsr_balkan_war.103.t: "バナト分割"
 tsr_balkan_war.103.d: "バルカン戦争後に独立したバナト共和国がユーゴスラビアとルーマニアによって分割された。西バナトはユーゴスラビアに、ティミショアラを含む東バナトはルーマニアに編入された。"
 tsr_balkan_war.103.a: "バルカンの安定に寄与する"
 tsr_balkan_war.103.b: "また一つ国が消えた..."
 tsr_balkan_war.20.t: "ドイツ借款の返済"
 tsr_balkan_war.20.d: "戦争は終わったが、ドイツへの借款返済の目処が立たない。領土の大半を失った我が国にはもはや返済能力がない。ドイツはその代償として、ドイツ系住民が多数を占めるブルゲンラントの割譲を要求している。"
 tsr_balkan_war.20.a: "やむを得ない...ブルゲンラントを割譲する"
 tsr_balkan_war.21.t: "ブルゲンラントの取得"
 tsr_balkan_war.21.d: "ハンガリーが戦時借款の返済に窮し、ブルゲンラントを割譲した。ドイツ系住民の多いこの地域は、正当にドイツ帝国に編入されることになった。"
 tsr_balkan_war.21.a: "当然の帰結だ"
 tsr_balkan_war.22.t: "講和条件監視"
 tsr_balkan_war.22.d: ""
 tsr_balkan_war.22.a: "了解"
