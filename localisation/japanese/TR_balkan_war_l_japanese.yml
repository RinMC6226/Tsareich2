l_japanese:
 tsr_balkan_war.1.t: "バルカン国境事変"
 tsr_balkan_war.1.d: "ハンガリー南部国境で重大な武力衝突が発生した。ヴォイヴォディナのセルビア系住民に対する弾圧への抗議が激化し、国境を挟んだ銃撃戦に発展している。双方に死傷者が出ており、ベオグラードは「同胞の保護」を名目に軍の動員を示唆し始めた。バルカン半島に暗雲が垂れ込めている。"
 tsr_balkan_war.1.a: "国境警備を強化する"
 tsr_balkan_war.2.t: "ハンガリーへの宣戦布告"
 tsr_balkan_war.2.d: "国境事変以来、外交交渉は何の実も結ばなかった。ハンガリーは弾圧をやめず、我が同胞は今なお鉄鎖に繋がれている。ロシアは戦時借款の供与を約束し、バルカン協商の盟友ルーマニアも好意的な態度を示している。これ以上の猶予は裏切りに等しい——武力による解放の時が来た。"
 tsr_balkan_war.2.a: "ハンガリーに宣戦布告する"
 tsr_balkan_war.3.t: "ユーゴスラビアが宣戦布告！"
 tsr_balkan_war.3.d: "ユーゴスラビアが我が国に宣戦布告した。南部国境からユーゴスラビア軍が怒涛の勢いで侵攻を開始し、前線の守備隊は激しい抵抗を続けている。ブダペストでは動員令が発令され、市民は戦争の衝撃に震えている。祖国の存亡を賭けた戦いが始まった。"
 tsr_balkan_war.3.a: "祖国を守れ！"
 tsr_balkan_war.4.t: "ハンガリーへの支援"
 tsr_balkan_war.4.d: "バルカン半島は我がドイツ帝国の生命線である。ロシアの影響下にあるユーゴスラビアの膨張を許せば、中欧における帝国の勢力圏は根底から覆される。だが直接介入はロシアとの全面衝突を招きかねない。装備と軍事顧問の派遣、そして戦時借款——間接支援によってハンガリーの抵抗を支える。返済は戦後に求めればよい。"
 tsr_balkan_war.4.a: "ハンガリーに借款を与える"
 tsr_balkan_war.5.t: "ユーゴスラビアへの支援"
 tsr_balkan_war.5.d: "バルカンにおけるロシアの影響力を拡大する好機が訪れた。スラヴの兄弟たるユーゴスラビアが、ドイツの走狗ハンガリーに対して立ち上がったのだ。戦時借款として装備と軍事顧問団を送ることで、ロシアはこの戦争の結末を左右する力を手にする。勝利の暁には、バルカンの勢力図は一変するだろう。"
 tsr_balkan_war.5.a: "ユーゴスラビアを支援する"
 tsr_balkan_war.6.t: "ドイツからの支援"
 tsr_balkan_war.6.d: "ドイツ帝国から戦時借款として大量の歩兵装備と砲兵装備、さらに軍事顧問団が到着した。前線の兵士たちは待望の補給に士気を取り戻している。だがこの支援は無償ではない——戦後の返済条件がどれほど苛烈なものになるか。それは、まず生き延びてから考えるべきことだ。"
 tsr_balkan_war.6.a: "ドイツの支援に感謝する"
 tsr_balkan_war.7.t: "ロシアからの支援"
 tsr_balkan_war.7.d: "ロシア帝国からの戦時借款が届き始めた。最新鋭の歩兵装備と砲兵装備がペテルブルクから続々と到着し、ロシアの軍事顧問団が我が軍の指揮系統に組み込まれている。この膨大な支援は前線に圧倒的な優勢をもたらすだろう。ただし、勝利の後に待つ返済の重荷は、今は考えまい。"
 tsr_balkan_war.7.a: "ロシアの支援に感謝する"
 tsr_balkan_war.8.t: "トランシルヴァニア回復の好機"
 tsr_balkan_war.8.d: "戦況はユーゴスラビアの優勢に傾きつつある。ハンガリーは南部戦線に戦力を集中せざるを得ず、東部国境の防備は日に日に手薄になっている。セーケイ地方を含む全トランシルヴァニアを回復する好機は、この先二度と訪れないかもしれない。バルカン協商の盟約に基づき、ユーゴスラビア側での参戦を決断する時が来た。"
 tsr_balkan_war.8.a: "ユーゴスラビア側で参戦する"
 tsr_balkan_war.9.t: "ルーマニアが参戦！"
 tsr_balkan_war.9.d: "ルーマニアがバルカン協商の一員としてユーゴスラビア側に参戦した。東部国境からルーマニア軍が雪崩のように侵攻を開始し、トランシルヴァニアの防衛線は崩壊の危機に瀕している。南にユーゴスラビア、東にルーマニア——我が国は絶望的な二正面戦争に投げ込まれた。もはやドイツの支援だけが最後の頼みの綱である。"
 tsr_balkan_war.9.a: "状況は厳しい..."
 tsr_balkan_war.10.t: "離間工作"
 tsr_balkan_war.10.d: ""
 tsr_balkan_war.10.a: "了解"
 tsr_balkan_war.11.t: "少数民族の蜂起"
 tsr_balkan_war.11.d: "前線の敗北が引き金となり、かねてより燻っていた火種がついに燃え上がった。スロヴァキア人がブラチスラバで武装蜂起し、カルパトのルテニア人がウジュホロドで独立を宣言、バナト地方ではセルビア系・ルーマニア系住民が共和国の樹立を叫んでいる。三方向からの離反により後方は混乱に陥り、軍は前線と内地の双方で戦わねばならなくなった。国家が内側から崩壊していく。"
 tsr_balkan_war.11.a: "我々は裏切られた！"
 tsr_balkan_war.12.t: "バナト共和国の独立"
 tsr_balkan_war.12.d: "バナト地方のセルビア系・ルーマニア系住民がハンガリーの支配を脱し、バナト共和国として独立を宣言した。ティミショアラの市庁舎に新たな旗が翻り、住民たちは解放の喜びに沸いている。小さいながらも、自由を求める民の意志が新国家を誕生させた。"
 tsr_balkan_war.12.a: "自由を手に入れた！"
 tsr_balkan_war.13.t: "スロヴァキアの独立"
 tsr_balkan_war.13.d: "スロヴァキア人がハンガリーの支配に終止符を打ち、独立国家の樹立を宣言した。ブラチスラバの街頭では義勇兵が武器を手に集結し、ハンガリー軍の守備隊を駆逐しつつある。長い隷属の時代が終わりを告げ、スロヴァキア民族は自らの運命を自らの手で切り開く。"
 tsr_balkan_war.13.a: "スロヴァキアに栄光あれ！"
 tsr_balkan_war.14.t: "カルパト・ウクライナの独立"
 tsr_balkan_war.14.d: "カルパト山脈の麓で、ルテニア人がハンガリーからの独立を宣言した。ウジュホロドとムカチェヴォで義勇連隊が編成され、ハンガリーの支配機構は瞬く間に瓦解した。小さくとも自由な国——カルパト・ウクライナが、山々の間に産声を上げる。"
 tsr_balkan_war.14.a: "新たな国の始まり！"
 tsr_balkan_war.15.t: "バルカン戦争の終結"
 tsr_balkan_war.15.d: "もはや戦争を継続する力は残されていない。前線は崩壊し、少数民族地域は相次いで離反し、残されたのはブダペストとその周辺のみである。屈辱的な講和条件を前に、政府は苦渋の決断を下すほかない。ヴォイヴォディナ、プレクムリェ、トランシルヴァニア——かつてのハンガリー王国の広大な領土は、二度と戻らない。"
 tsr_balkan_war.15.a: "和平条件を受け入れる"
 tsr_balkan_war.16.t: "バルカン戦争の勝利"
 tsr_balkan_war.16.d: "バルカン戦争は我が国の勝利に終わった。ヴォイヴォディナのセルビア人同胞はついに解放され、南スラヴ統一の大義は成就した。だが勝利の代償は小さくない——ロシアへの膨大な戦時債務が、これから何年にもわたって国家財政を圧迫することになる。勝者もまた、この戦争の代価を払わねばならない。"
 tsr_balkan_war.16.a: "勝利、しかし代償も..."
 tsr_balkan_war.17.t: "トランシルヴァニアの回復"
 tsr_balkan_war.17.d: "バルカン戦争の結果、セーケイ地方を含む全トランシルヴァニアがルーマニアの手に帰した。幾世代にもわたる民族の悲願——大ルーマニアの完成がついに成就した。クルジュ、アラド、オラデア——かつてハンガリーの支配下にあった街々に、ルーマニアの三色旗が翻っている。"
 tsr_balkan_war.17.a: "大ルーマニアの完成！"
 tsr_german_proxy_support: "ドイツの軍事支援"
 tsr_german_proxy_support_desc: "ドイツ帝国がバルカン戦争において我が国に装備と軍事顧問を派遣している。戦力は増強されたが、ドイツ式の運用体系への適応に伴い部隊の機動力は低下している。"
 tsr_russian_war_loan: "ロシアからの戦時借款"
 tsr_russian_war_loan_desc: "ロシア帝国から戦時借款として大量の装備と軍事支援を受けている。我が軍は圧倒的な物量を手にしたが、ロシア式の補給体系への依存は兵站を圧迫し、部隊の展開速度にも影響を及ぼしている。この借款は戦後に必ず返済しなければならない。"
 tsr_transylvania_irredentism: "トランシルヴァニア回復運動"
 tsr_transylvania_irredentism_desc: "全トランシルヴァニアの回復は我が国民の悲願である。兵士たちは祖先の地を取り戻すという使命感に燃えている。"
 tsr_balkan_war_exhaustion: "バルカン戦争の疲弊"
 tsr_balkan_war_exhaustion_desc: "バルカン戦争で壊滅的な敗北を喫し、国土の大半を失った。国家は疲弊の極みにあり、政治的混乱と経済的困窮が国民生活を蝕んでいる。"
 tsr_yug_war_debt: "ロシアへの戦時債務"
 tsr_yug_war_debt_desc: "バルカン戦争での勝利はロシアからの膨大な戦時借款によって支えられていた。今やその返済が国家財政を圧迫し、民間工場はロシアへの債務弁済のために徴用されている。勝利の代償は重い。"
 tsr_balkan_entente: "バルカン協商"
 tsr_hun_multiethnic_army: "多民族軍"
 tsr_hun_multiethnic_army_desc: "ハンガリーは多民族国家であり、マジャル人以外の住民からも広く兵士を徴用している。兵力の確保には有利だが、言語や忠誠心の相違が軍の士気と結束を蝕んでいる。"
 tsr_balkan_war.100.t: "バルカン戦争勃発！"
 tsr_balkan_war.100.d: "ユーゴスラビアがハンガリーに宣戦布告し、バルカン半島で大規模な戦争が勃発した。表面上は南スラヴ同胞の解放を掲げる民族戦争だが、その背後にはドイツとロシアの影響圏争いが透けて見える。欧州の勢力均衡が大きく揺らぎかねない事態である。"
 tsr_balkan_war.100.a: "正義は我らにあり！"
 tsr_balkan_war.100.b: "侵略者を撃退する！"
 tsr_balkan_war.100.c: "バルカンの情勢は緊迫している..."
 tsr_balkan_war.101.t: "ルーマニア、バルカン戦争に参戦"
 tsr_balkan_war.101.d: "ルーマニアがバルカン協商の一員としてハンガリーに宣戦布告した。トランシルヴァニアの回復を掲げるルーマニア軍が東部から侵攻を開始し、ハンガリーは南と東の二正面作戦を強いられることになった。戦局の天秤はバルカン協商側に大きく傾きつつある。"
 tsr_balkan_war.101.a: "トランシルヴァニアを取り戻す！"
 tsr_balkan_war.101.b: "我が国は孤立無援だ..."
 tsr_balkan_war.101.c: "戦争の拡大は憂慮すべきだ"
 tsr_balkan_war.102.t: "バルカン戦争終結"
 tsr_balkan_war.102.d: "バルカン戦争がついに終結した。ハンガリーは領土の大半を失い、スロヴァキア、カルパト・ウクライナ、バナトが独立国家として誕生した。ヴォイヴォディナはユーゴスラビアに、トランシルヴァニアはルーマニアに移譲され、かつてのハンガリー王国はブダペスト周辺を残すのみの残存国家となった。バルカンの地図が、根底から書き換えられた。"
 tsr_balkan_war.102.a: "新たなバルカンの秩序だ"
 tsr_balkan_war.102.b: "屈辱的な講和だ..."
 tsr_balkan_war.102.c: "バルカンの地図が書き換えられた"
 tsr_balkan_war.18.t: "バナト分割協定"
 tsr_balkan_war.18.d: "バルカン戦争後に独立したバナト共和国は、その領土を自力で維持する力を持たない。ルーマニアとの分割協定を結ぶ時が来た。西バナトはセルビア系住民が多く我が国が取得し、ティミショアラを含む東バナトはルーマニア系住民が多くルーマニアに渡すのが妥当だろう。"
 tsr_balkan_war.18.a: "バナトを分割する"
 tsr_balkan_war.19.t: "バナト分割協定"
 tsr_balkan_war.19.d: "ユーゴスラビアとのバナト分割協定が成立した。ティミショアラを含む東バナトはルーマニア領となり、西バナトはユーゴスラビアに編入される。小さなバナト共和国の命運は、大国の論理によって決せられた。"
 tsr_balkan_war.19.a: "ティミショアラは我らのものだ"
 tsr_balkan_war.103.t: "バナト分割"
 tsr_balkan_war.103.d: "バルカン戦争後に独立したバナト共和国が、ユーゴスラビアとルーマニアによって分割された。西バナトはユーゴスラビアに、ティミショアラを含む東バナトはルーマニアに編入された。独立からわずか数週間で、また一つの国が地図から消えた。"
 tsr_balkan_war.103.a: "バルカンの安定に寄与する"
 tsr_balkan_war.103.b: "また一つ国が消えた..."
 tsr_balkan_war.20.t: "ドイツ借款の返済"
 tsr_balkan_war.20.d: "戦争は終わったが、ドイツへの借款返済の目処が立たない。領土の大半を失った我が国にはもはや返済能力がなく、ベルリンの催促は日増しに苛烈になっている。ドイツはその代償として、ドイツ系住民が多数を占めるブルゲンラントの割譲を要求してきた。残存国家に拒否する力はない。"
 tsr_balkan_war.20.a: "やむを得ない...ブルゲンラントを割譲する"
 tsr_balkan_war.21.t: "ブルゲンラントの取得"
 tsr_balkan_war.21.d: "ハンガリーが戦時借款の返済に窮し、ブルゲンラントの割譲に応じた。ドイツ系住民の多いこの地域は、正当にドイツ帝国に編入されることになった。敗戦国の窮状は、勝者にとっての好機である。"
 tsr_balkan_war.21.a: "当然の帰結だ"
 tsr_balkan_war.22.t: "講和条件監視"
 tsr_balkan_war.22.d: ""
 tsr_balkan_war.22.a: "了解"
 tsr_rom_opportunistic_neutrality: "日和見的中立"
 tsr_rom_opportunistic_neutrality_desc: "ルーマニアは戦況を注視している。バルカン協商に名を連ねつつも、勝機が熟すまでは参戦を避け、最小の犠牲で最大の戦果を得る好機を待っている。"
 tsr_balkan_war.30.t: "マジャル民族主義の高揚"
 tsr_balkan_war.30.d: "国境での緊張が高まる中、ブダペストの街頭では愛国主義の集会が相次いでいる。「聖イシュトヴァーンの王冠の地は不可分である」——失われた大ハンガリーの記憶が、再び国民の心を熱くしている。"
 tsr_balkan_war.30.a: "祖国の団結を示せ"
 tsr_balkan_war.31.t: "南スラヴ統一の大義"
 tsr_balkan_war.31.d: "ハンガリーの軛に苦しむ南スラヴの同胞を解放する——この聖なる使命のもと、ベオグラードは国を挙げて戦争を支持している。ヴォイヴォディナのセルビア人は解放者の到来を待ち望んでいるという。"
 tsr_balkan_war.31.a: "同胞のために戦う"
 tsr_balkan_war.32.t: "ブダペストの守り"
 tsr_balkan_war.32.d: "ドナウ河畔の首都に防衛陣地が築かれ始めた。市民は防空壕を掘り、義勇兵が登録所に列をなす。だが二正面に迫る敵を前に、首都を守り抜けるのか、不安の影は拭えない。"
 tsr_balkan_war.32.a: "首都を要塞化せよ"
 tsr_balkan_war.33.t: "解放者か、征服者か"
 tsr_balkan_war.33.d: "ヴォイヴォディナに進駐した我が軍を、セルビア系住民は花束で迎えた。だがハンガリー系やドイツ系の村では、扉は固く閉ざされている。解放の旗の下で、新たな民族問題の火種が燻り始めている。"
 tsr_balkan_war.33.a: "秩序を維持せよ"
 tsr_balkan_war.34.t: "ベルリンの計算"
 tsr_balkan_war.34.d: "参謀本部では激論が交わされている。ハンガリーへの直接介入はロシアとの全面対決を招きかねない。しかし緩衝国の喪失もまた許容しがたい。皇帝は当面、装備と顧問による間接支援に留める方針を選んだ。"
 tsr_balkan_war.34.a: "代理戦争に徹する"
 tsr_balkan_war.35.t: "汎スラヴ主義の潮流"
 tsr_balkan_war.35.d: "ペテルブルクの世論は沸騰している。スラヴの兄弟たるユーゴスラビアへの支援を求める声が、新聞と議会を埋め尽くす。汎スラヴ主義者は更なる関与を要求するが、政府はドイツとの直接衝突を慎重に避けている。"
 tsr_balkan_war.35.a: "スラヴの大義を掲げよ"
 tsr_balkan_war.36.t: "膠着する戦線"
 tsr_balkan_war.36.d: "戦線は泥濘と化した。ドイツ製の装備で固めた防衛線は持ちこたえているが、反撃に転じる余力はない。両軍は塹壕を挟んで睨み合い、戦争は消耗戦の様相を呈し始めている。"
 tsr_balkan_war.36.a: "戦線を維持せよ"
 tsr_balkan_war.37.t: "燻る火種"
 tsr_balkan_war.37.d: "戦争の長期化とともに、非中核州の不穏な空気が報告されるようになった。スロヴァキア、ルテニア、バナト——各地で秘密集会や徴兵忌避が頻発している。敵の工作員が暗躍しているとの噂も絶えない。"
 tsr_balkan_war.37.a: "監視を強化せよ"
 tsr_balkan_war.38.t: "難民の波"
 tsr_balkan_war.38.d: "失われた領土から、マジャル系の難民が残存ハンガリーへと押し寄せている。ブダペストとその周辺は飽和状態に達し、食糧と住居の不足が深刻化している。敗戦の現実が、日々国民の前に突きつけられる。"
 tsr_balkan_war.38.a: "難民を受け入れよ"
 tsr_balkan_war.39.t: "復讐の誓い"
 tsr_balkan_war.39.d: "屈辱的な講和は、かえって国民の心に消えぬ怒りを刻みつけた。「我々は決して忘れない、決して許さない」——失地回復を叫ぶ声が、廃墟となった国家の隅々に響いている。次なる戦いへの種が、今まかれた。"
 tsr_balkan_war.39.a: "いつの日か取り戻す"
 tsr_balkan_war.40.t: "勝利の重荷"
 tsr_balkan_war.40.d: "戦勝の歓喜は長くは続かなかった。ロシアからの戦時借款の請求書が、勝利の祝杯に影を落とす。ヴォイヴォディナは手に入れたが、その代償としてユーゴスラビアはロシアへの経済的従属を深めることになった。"
 tsr_balkan_war.40.a: "代償は重い"
 tsr_balkan_war.41.t: "大ルーマニアの祝祭"
 tsr_balkan_war.41.d: "ブカレストは祝祭に沸いている。セーケイ地方を含む全トランシルヴァニアがついに回復され、大ルーマニアの悲願が成就した。教会の鐘が鳴り響き、人々は通りで歓喜の踊りを舞っている。"
 tsr_balkan_war.41.a: "大ルーマニア万歳！"
 tsr_balkan_war.42.t: "バルカンの新秩序"
 tsr_balkan_war.42.d: "ブルゲンラントの編入により、バルカン半島におけるドイツの足場は確保された。残存ハンガリーは事実上の従属国となり、ドイツの影響圏に組み込まれた。だがロシアもまたユーゴスラビアを通じて南下を続けている。新たな対立の構図が、バルカンに描かれつつある。"
 tsr_balkan_war.42.a: "影響圏を固めよ"
 tsr_balkan_war.107.t: "ブルゲンラントの割譲"
 tsr_balkan_war.107.d: "バルカン戦争の結果、ハンガリーはドイツへの戦時借款返済の一環として、ブルゲンラントの割譲に応じた。ドイツ系住民が多数を占めるこの地域は、正当にドイツ帝国に編入されることになった。"
 tsr_balkan_war.107.a: "これは避けられない結果だった"
 tsr_balkan_war.107.b: "負けた国の宿命だ"
 tsr_bul_defensive_pact: "ハンガリーとの防衛協定"
 tsr_bul_defensive_pact_desc: "ブルガリアはハンガリーと防衛協定を結んでおり、その義務に基づき参戦した。共通の敵ユーゴスラビアに対し、両国は連携して防衛戦を戦う。"
 tsr_gre_thracian_ambition: "トラキア進出の野心"
 tsr_gre_thracian_ambition_desc: "ユーゴスラビアとの秘密協定を背景に、ギリシャはトラキア地方の全面的支配を狙っている。ブルガリアが北方の戦線に釘付けとなった今こそ好機である。"
 tsr_bul_war_reparations: "戦争賠償と難民"
 tsr_bul_war_reparations_desc: "敗戦の代償として、ブルガリアはギリシャへの賠償金支払いを課せられた。加えて、トラキアから追放されたブルガリア系難民の波が、国家財政と社会を圧迫している。"
 tsr_bul_demilitarized_frontier: "南部国境の非武装化"
 tsr_bul_demilitarized_frontier_desc: "講和条件により、ブルガリアは対ギリシャ国境地帯の非武装化を強いられた。要塞の構築は禁じられ、南部の防衛は脆弱なまま放置されている。"
 tsr_gre_aegean_supremacy: "エーゲ海の覇権"
 tsr_gre_aegean_supremacy_desc: "ブルガリアの修正主義を打ち砕き、トラキアにおけるギリシャの支配を盤石なものとした。エーゲ海北岸の覇権は、もはや揺るがない。"
 tsr_balkan_war.50.t: "防衛協定の発動"
 tsr_balkan_war.50.d: "ハンガリーがユーゴスラビアに攻撃された。両国を結ぶ防衛協定は、今や発動の時を迎えた。ブルガリアは盟約に従い参戦する。これは長年の宿敵ユーゴスラビアと決着をつける好機でもある。我が軍は北のセルビア戦線へ向かう。"
 tsr_balkan_war.50.a: "協定の義務を果たす"
 tsr_balkan_war.51.t: "ブルガリアの参戦"
 tsr_balkan_war.51.d: "防衛協定に基づき、ブルガリアが我が方に立って参戦した。南方に強力な盟友を得たことで、ユーゴスラビアとルーマニアは新たな戦線への対応を強いられるだろう。孤立無援だった我が国に、一筋の光明が差した。"
 tsr_balkan_war.51.a: "心強い援軍だ"
 tsr_balkan_war.52.t: "秘密協定の発動"
 tsr_balkan_war.52.d: "ブルガリアがハンガリー側で参戦し、その主力をセルビア戦線に集中させている。今こそユーゴスラビアとの秘密協定を発動する時だ。手薄になったブルガリアの背後を突き、トラキア全域を我が手中に収めるのだ。"
 tsr_balkan_war.52.a: "ブルガリアの背後を突く"
 tsr_balkan_war.53.t: "背後を突かれる"
 tsr_balkan_war.53.d: "セルビア戦線に主力を投入した隙を突き、ギリシャが南方から侵攻を開始した。ユーゴスラビアとの間に秘密協定があったのだ。我が軍は二正面での防衛を強いられ、トラキア国境は危機に瀕している。"
 tsr_balkan_war.53.a: "謀られた！"
 tsr_balkan_war.54.t: "ギリシャの呼応"
 tsr_balkan_war.54.d: "秘密協定に基づき、ギリシャがブルガリアの背後を突いて参戦した。南方に新たな戦線が開かれ、ブルガリアは挟撃される形となった。バルカン協商の勝利は、いよいよ確実なものとなりつつある。"
 tsr_balkan_war.54.a: "好機を逃すな"
 tsr_balkan_war.55.t: "トラキア講和"
 tsr_balkan_war.55.d: "戦争は敗北に終わった。講和条件は過酷である——ギリシャ領トラキアのブルガリア系住民は強制的に追放され、我が国へと流入する。南部国境は非武装化され、多額の賠償金が課せられた。マケドニアもトラキアも、もはや夢のまた夢となった。"
 tsr_balkan_war.55.a: "屈辱を受け入れる"
 tsr_balkan_war.56.t: "トラキアの確定"
 tsr_balkan_war.56.d: "南部戦線はギリシャの勝利に終わった。トラキアのブルガリア系住民は追放され、この地は人口的にも完全にギリシャのものとなった。ブルガリアの修正主義は打ち砕かれ、エーゲ海北岸におけるギリシャの覇権が確立された。漁夫の利は、我が手にある。"
 tsr_balkan_war.56.a: "トラキアは我らのものだ"
 tsr_balkan_war.104.t: "ブルガリア、バルカン戦争に参戦"
 tsr_balkan_war.104.d: "ブルガリアがハンガリーとの防衛協定に基づき参戦した。ユーゴスラビアとルーマニアは新たな南方戦線への対応を迫られ、戦争は一層の広がりを見せている。バルカン半島全体を巻き込む大戦の様相が強まってきた。"
 tsr_balkan_war.104.a: "盟約は果たされた"
 tsr_balkan_war.104.b: "南からの脅威だ"
 tsr_balkan_war.104.c: "戦火が拡大していく"
 tsr_balkan_war.105.t: "ギリシャ、バルカン戦争に参戦"
 tsr_balkan_war.105.d: "ギリシャがユーゴスラビア側で参戦し、ブルガリアの背後を突いた。両国の間には秘密協定が存在したと見られる。ブルガリアは二正面戦争を強いられ、バルカン協商側の優位は決定的となりつつある。"
 tsr_balkan_war.105.a: "包囲は完成した"
 tsr_balkan_war.105.b: "我が軍は挟撃される"
 tsr_balkan_war.105.c: "誰も信用できない時代だ"
 tsr_balkan_war.106.t: "トラキア講和と住民交換"
 tsr_balkan_war.106.d: "バルカン戦争の南部戦線が決着した。ギリシャの勝利により、トラキアのブルガリア系住民はブルガリアへと強制移住させられ、トラキアは人口的にギリシャの地として確定した。ブルガリアは国境の非武装化と賠償金を課せられ、その修正主義の野望は潰えた。"
 tsr_balkan_war.106.a: "トラキアは永遠にギリシャのもの"
 tsr_balkan_war.106.b: "我が同胞が故郷を追われた"
 tsr_balkan_war.106.c: "民族移動の悲劇だ"
