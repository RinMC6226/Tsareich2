l_japanese:
 SPR_GATHERING_STORM_DESC: "スペイン人民共和国は内戦と王政の時代を越え、革命国家としてイベリア半島に立っている。だが新体制はまだ脆く、経済再建、軍の再編、そして欧州革命の行方という重い課題を抱えている。同志たちの理想を守り抜くため、スペインは再び歴史の前線へ進まねばならない。"
 ITA_GATHERING_STORM_DESC: "イタリア社会主義共和国は旧体制を打倒し、労働者国家として地中海世界に新たな旗を掲げた。しかし国内には旧支配層の残滓、南北格差、そして革命の方向性を巡る対立が残っている。ローマから始まった変革が欧州を揺るがす力となるかは、これからの選択にかかっている。"
 FRA_GATHERING_STORM_DESC: "フランス・コミューン連合は敗戦の屈辱と社会の分裂を乗り越え、革命政府の下で再出発を遂げた。だが東には戦勝国ドイツ帝国、西には不安定な大西洋秩序が広がり、国内にも軍と党、都市と地方の緊張が残る。革命の祖国フランスは、生き残るだけでなく、欧州の未来そのものを賭けて進まねばならない。"
 GER_GATHERING_STORM_DESC: "第一次世界大戦に勝利したドイツ帝国は、ロシアとの同盟を軸に欧州大陸の秩序を築いた。帝国は戦勝国として大陸に強い影響力を持つが、その勝利は永遠の安定を約束するものではなかった。赤化したフランス、イタリア、スペインが西方に並び、英国は失われた威信を取り戻すため帝国再興の野心を燃やしている。勝者となったドイツは、同盟と勢力圏を維持し、国内の課題に向き合いながら、今やその勝利を守るために再び立ち上がらねばならない。"
 RUS_GATHERING_STORM_DESC: "ドイツと共に大戦を制したロシア帝国は、革命を退け、ツァーリの玉座を守り抜いた。勝利によって帝国は崩壊を免れたが、その広大な領土の内側には近代化の遅れ、民族問題、農村の停滞、そして旧来の官僚制度が残されている。西欧では共産主義が勢力を広げ、英国もまた帝国再興の野心を燃やしている。戦勝国でありながら不安定な巨人であるロシアは、ツァーリの権威を保ちながら、新たな時代にふさわしい姿を見出さねばならない。"
