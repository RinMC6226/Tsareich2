l_japanese:
 tsr_bay.1.t: "公現祭の朝"
 tsr_bay.1.d: "一月六日の朝、ミュンヘンの教会の鐘が冬の空気を震わせた。公現祭の典礼に合わせ、王国の宮廷、州政府の官僚、軍管区の代表、そして旧来の名望家たちはそれぞれの席に着き、バイエルンが帝国の一部でありながら、なお独自の王国としての記憶と秩序を保っていることを静かに確かめている。\n\n街路には祝日の落ち着いた気配があり、レジデンツの周辺では制服姿の将校と黒衣の聖職者が言葉少なに挨拶を交わす。ベルリンから届く命令書と帝国官報は日ごとに厚みを増し、行政の文言はしばしば南ドイツの慣習を無骨に押しならそうとする。それでもこの日、ミュンヘンの人々は王冠、教会、そしてバイエルンの自治が単なる過去の装飾ではないことを思い出す。\n\n儀礼は政治声明ではない。だが参列者の誰もが、それが無言の確認であることを理解していた。バイエルン王国は帝国に忠実である。しかし忠実であることと、沈黙して消えていくことは同じではない。"
 tsr_bay.1.a: "王国の伝統は続く"