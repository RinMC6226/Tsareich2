l_japanese:
  tsr_ger_military.1.t: "帝国戦争省"
  tsr_ger_military.1.d: "陸軍の多様化は、帝国の根幹たる領邦軍隊制度の解体へベルリンを傾倒させることとなった。ドイツ帝国政府は、プロイセン戦争省を改組し、ドイツ帝国戦争省へ再編することを発表した。\n諸邦―特にバイエルン王国―への最大限の配慮として、これが即座にプロイセン戦争省の権力拡大は意味しない旨を明言したが、大戦争を戦い抜き、深まる西側からの圧力に頭を悩ませている諸邦の軍事に通じた男たちにとって、もはや1871年以来守られてきた体制が終わりつつあることを意味することは火を見るよりも明らかだった。\n\n各地の諸邦には発表から即座に公的に通知を行ったが、彼らもベルリンにとっては単なる権力の残滓に過ぎなかった。ただ、ミュンヘンは沈黙していた。バイエルン王国は諸邦の中で独立した軍を今も実質的に指揮している唯一の勢力だった。\nミュンヘンの権力者たちが、この行動がバイエルン管轄下の陸軍を統合しようとする試みと判断すれば、彼らの猛烈な反対と、帝国に立ち込める不安の加速は避けられないだろう。"
  tsr_ger_military.1.a: "始まりに過ぎない"

  TR_GER_military_decisions: "軍事改革"
  TR_GER_military_decisions_desc: "帝国戦争省の創設は、各邦に残された軍事上の特権をめぐる疑念を呼び起こしている。"
  GER_suspected_privileges_mission: "疑われた特権"
  GER_suspected_privileges_mission_desc: "帝国憲法第66条による軍制整理が進まないまま時間が経てば、バイエルンは帝国戦争省の権限拡大を既得権への攻撃と見なし、州内の徴兵と工業協力を拒むだろう。"

  tsr_ger_military.2.t: "ベルリンからの通達"
  tsr_ger_military.2.d: "ベルリンが驚くべき声明を発した。\nドイツ帝国成立以来守られてきた領邦制度を遂に発起人たる帝国政府が踏みにじろうとしてきたのだ。\n\n昼過ぎに届いた通達では、バイエルン王国軍に現時点で影響は一切ないものの、プロイセン王国陸軍を指揮するプロイセン戦争省が、帝国戦争省へと格上げされたとのことだった。\n\nその通達は即座にバイエルン王国軍の指揮官にも共有され、レジデンツは突如始まった公然とした地方権力の否定に対して大いに混乱した。ある者は時代の流れとして納得したし、ある者は王国の伝統への挑戦だと激高した。\n我々は何らかの返答をせねばならない。ベルリンの行動に対して、バイエルン王国は一定の独立心の下で動いていることを示さねばならない。"
  tsr_ger_military.2.a: "経過を注視せよ"
  tsr_ger_military.2.b: "抗議せよ"
  tsr_ger_military.2.c: "悪夢の始まりだ"

  tsr_ger_military.2.tt_1: "何もしない。今のところは。"
  tsr_ger_military.2.tt_2: "§Yドイツ帝国§Wに丁重な抗議をし、自治権の縮小に明確に反対する立場を示す。"
  tsr_ger_military.2.tt_3: "§Yドイツ帝国§Wに厳重な抗議をし、§Yバイエルン§Wの陸軍が§R最悪の事態§Wに対して準備を始める。\n§R血と鉄による独立へ突き進むことになる！§W"


