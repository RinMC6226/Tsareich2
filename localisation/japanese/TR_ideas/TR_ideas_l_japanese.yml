l_japanese:
	rural_economy:"農村経済"
	rural_economy_desc:"ロシア帝国における長い長い繁栄は、同時に帝国の前進を妨害した。中世より続く伝統的な経済組織は、若干の変質はありながらも依然存続しており、ロシアにおける国家の主導した経済活動を妨害している。"


 RUS_memory_of_greatwar:"勝利の記憶"
 RUS_memory_of_greatwar_desc:"ロシア帝国の大戦争における勝利は、その後の様々な困難の中で民衆がツァーリを信ずるに足るものだった。1919年に打ち立てた世界の憲兵としての帝国の威光はドーヴァーからカムチャツカまで、世界の至る所に強い影響力を持つ根源となっている。"
 RUS_1935_military_badget:"1935年度軍事予算"
 RUS_1935_military_badget_desc:"192X年の世界経済危機によってドイツ帝国の経済が破綻したのち、貿易関係の強い我が国の基盤産業も深刻な損害を受けた。10年立つ今も帝国は経済的に安定しておらず、1935年には以降3年間の軍事予算の大幅な縮小と、国内産業の回復のための経済政策が採られたが、ロシア帝国の古めかしい経済構造に対して政府は効果的な手法を打ち出せていない。"
 RUS_army_greatwar:"大戦争の軍隊"
 RUS_army_greatwar_desc:"ロシア陸軍は大戦争において、ドイツ帝国の西部戦線に対して大規模な歩兵火力支援を行い、戦線の進行に大きく貢献した。塹壕を用いて防衛し、突撃によって敵を蹴散らす古典的だが確かな戦法は、ロシア陸軍において揺るがない教義として根付いている。いかなる火力に対してもロシアの兵士は後退することはない。"

 RUS_poland_badget:"ポーランド統治特別予算"
 RUS_poland_badget_desc:"ポーランドは長くロシア帝国の支配下であったが、経済的危機の中でこの地域の反対運動弾圧が大きく困難になった。政府はワルシャワに監視機関を設置し、統一的な治安維持にあたるための資金を特別予算として支出したが、これはロシア政府に資金面で重い負担となることになった。"
 RUS_finland_badget:"フィンランド統治特別予算"
 RUS_finland_badget_desc:"フィンランドにおけるロシア帝国の統治基盤は強固なものであったが、ドイツから波及した経済危機はフィンランド地域経済をも混乱させ、我々はヘルシンキにおける大規模な治安維持を行わざるを得ない状況となった。これによる支出はロシア帝国に対して大きな出費として負担となっている。"