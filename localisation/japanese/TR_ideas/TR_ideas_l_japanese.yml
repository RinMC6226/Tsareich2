l_japanese:
	rural_economy:"農村経済"
	rural_economy_desc:"ロシア帝国における長い長い繁栄は、同時に帝国の前進を妨害した。中世より続く伝統的な経済組織は、若干の変質はありながらも依然存続しており、ロシアにおける国家の主導した経済活動を妨害している。"


 RUS_memory_of_greatwar:"勝利の記憶"
 RUS_memory_of_greatwar_desc:"ロシア帝国の大戦争における勝利は、その後の様々な困難の中で民衆がツァーリを信ずるに足るものだった。1919年に打ち立てた世界の憲兵としての帝国の威光はドーヴァーからカムチャツカまで、世界の至る所に強い影響力を持つ根源となっている。"
 RUS_1935_military_badget:"1935年度軍事予算"
 RUS_1935_military_badget_desc:"192X年の世界経済危機によってドイツ帝国の経済が破綻したのち、貿易関係の強い我が国の基盤産業も深刻な損害を受けた。10年立つ今も帝国は経済的に安定しておらず、1935年には以降3年間の軍事予算の大幅な縮小と、国内産業の回復のための経済政策が採られたが、ロシア帝国の古めかしい経済構造に対して政府は効果的な手法を打ち出せていない。"
 RUS_army_greatwar:"大戦争の軍隊"
 RUS_army_greatwar_desc:"ロシア陸軍は大戦争において、ドイツ帝国の西部戦線に対して大規模な歩兵火力支援を行い、戦線の進行に大きく貢献した。塹壕を用いて防衛し、突撃によって敵を蹴散らす古典的だが確かな戦法は、ロシア陸軍において揺るがない教義として根付いている。いかなる火力に対してもロシアの兵士は後退することはない。"

 RUS_poland_badget:"ポーランド統治特別予算"
 RUS_poland_badget_desc:"ポーランドは長くロシア帝国の支配下であったが、経済的危機の中でこの地域の反対運動弾圧が大きく困難になった。政府はワルシャワに監視機関を設置し、統一的な治安維持にあたるための資金を特別予算として支出したが、これはロシア政府に資金面で重い負担となることになった。"
 RUS_finland_badget:"フィンランド統治特別予算"
 RUS_finland_badget_desc:"フィンランドにおけるロシア帝国の統治基盤は強固なものであったが、ドイツから波及した経済危機はフィンランド地域経済をも混乱させ、我々はヘルシンキにおける大規模な治安維持を行わざるを得ない状況となった。これによる支出はロシア帝国に対して大きな出費として負担となっている。"

 RUS_muslim_researcher:"イスラム系技術者の登用"
 RUS_muslim_researcher_desc:"イスラム系技術者の公式な立場への登用は、国内における技術革新の進展に寄与するだろう。"
 RUS_freezed_budget:"予算凍結"
 RUS_freezed_budget_desc:"帝国の財務を管理する予算は凍結され、予備財源の支出しか認められていない現状では、ほとんどの国策は資金的に行うことはできない。"










 JAP_treaty_of_tsushima:"対馬条約"
 JAP_treaty_of_tsushima_desc:"第一次世界大戦において日本は英仏とともにロシアに敗れ、日露戦争に続く二度目の敗北を喫した。1919年に講和条約として締結された対馬条約は、日本政府に対して賠償金や対外拡張の制限、帝国海軍への厳しい軍備制限を課した。"
 JAP_treaty_of_tsushima_violation:"対馬条約違反"
 JAP_treaty_of_tsushima_violation_desc:"日本海軍は対馬条約の許容枠を超え始めており、対露均衡を重視する列強からの監視と圧力が強まっている。"
 JAP_treaty_of_tsushima_major_violation:"重大な対馬条約違反"
 JAP_treaty_of_tsushima_major_violation_desc:"日本海軍は対馬条約を事実上踏み越え、講和体制そのものを揺さぶっている。外交的圧力と国内負担は一段と重くなった。"
 TR_JAP_tsushima_treaty:"対馬条約体制"
 JAP_review_tsushima_treaty:"対馬条約の規定"
 JAP_tsushima_treaty_reduction_mission:"対馬条約の海軍縮小要求"
 JAP_tsushima_treaty_reduction_mission_desc:"日本海軍の戦力は、対馬条約が認める対露比率を超えつつある。30日以内に保有戦力をロシア海軍の半分未満まで圧縮しなければ、条約違反として追加の制裁を受ける。"
 JAP_tsushima_treaty_major_reduction_mission:"対馬条約の最終警告"
 JAP_tsushima_treaty_major_reduction_mission_desc:"日本海軍は対馬条約の許容限界をさらに踏み越えている。30日以内に大幅な縮小を行わなければ、重大な条約違反としてより厳しい圧力を招く。"
 JAP_restore_tsushima_treaty_compliance:"対馬条約遵守を回復"
 tsr_jap_treaty.1.t:"対馬条約の危機"
 tsr_jap_treaty.1.d:"日本海軍は対馬条約の最終警告を無視し、対露均衡を明白に踏み越えた。ここでなお黙認すれば、ロシア帝国の威信と講和体制そのものが揺らぐ。一方で強硬に出れば、極東に新たな戦争を招く危険がある。"
 tsr_jap_treaty.1.a:"屈辱を呑んで黙認する"
 tsr_jap_treaty.1.b:"対日宣戦布告事由を準備せよ"

 GER_victor_of_the_great_war:"大戦の勝者"
 GER_victor_of_the_great_war_desc:"ドイツ帝国は大戦の勝者として欧州秩序の中心に立っている。西方の敵を退け、講和体制を主導した記憶は、皇帝、軍部、官僚、そして多くの国民にとって帝国の正統性そのものである。その栄光は国民統合と軍事的自信を支え、国内の対立を覆い隠す神話として機能してきた。しかし勝者であるという自負は、同時に帝国へ過大な責任を負わせる。属国、植民地、欧州の均衡、そして戦後秩序の維持は、すべてベルリンの威信と結びついている。勝利の記憶は力であると同時に、帝国を後退できない立場へ縛りつける鎖でもある。"
 GER_october_constitution:"十月憲法"
 GER_october_constitution_desc:"1918年十月改革の成果として成立した憲法体制は、皇帝制と議会政治を結びつける妥協である。大戦末期、国内の政治圧力と戦時動員の限界を前に、帝国は完全な専制でも完全な議会制でもない新たな統治形態を選び取った。宰相はなお皇帝の信任を必要とするが、帝国議会の多数派を無視して安定した統治を行うことも難しい。この曖昧さこそ十月憲法の核心であり、強みでも弱みでもある。保守派は皇帝大権の残存を守ろうとし、議会派は責任政治の拡大を求め、軍部は国家非常時における自らの役割を手放そうとしない。帝国の政治秩序は、この危うい均衡の上に成り立っている。"
 GER_great_depression:"世界恐慌"
 GER_great_depression_desc:"長期化した世界恐慌は、ドイツ帝国の繁栄に深い傷を残している。輸出市場の縮小は重工業と金融を直撃し、失業者の増加は都市部の社会不安を押し広げた。植民地と従属地域の維持費もまた膨らみ、勝者として築いた広大な勢力圏は、今や財政を圧迫する重荷にもなっている。財界と帝国銀行は通貨価値と均衡財政を優先すべきだと主張し、SPDや労組は雇用創出と社会保障の拡充を求める。保守派は不満が革命思想へ流れ込むことを恐れ、中央党は妥協の余地を探っている。帝国の産業力はなお巨大だが、政治的余裕と社会的忍耐は確実に失われつつある。"
 GER_austrian_question:"オーストリア問題"
 GER_austrian_question_desc:"第一次世界大戦後、オーストリアは戦後処理の過程でドイツ帝国へ組み込まれた。表向きにはドイツ民族の統合であり、帝国の勝利を象徴する成果の一つである。しかし現実の統合は、宣伝文句ほど容易ではない。旧オーストリアの官僚制度、法慣習、地方政治、カトリック社会の結びつきはプロイセン中心の帝国構造とは異なり、文化的にも『同じドイツ人』という言葉だけでは埋められない距離が存在する。さらにウィーンを中心とする経済圏は独自の商業・金融・産業関係を抱え、帝国本土への再編には摩擦と費用が伴う。オーストリア問題は領土問題では終わらない。勝利によって獲得した地域を、いかに帝国の一部として機能させるかという長期的な統治問題なのである。"
 GER_bloated_army:"肥大化した軍隊"
 GER_bloated_army_desc:"勝利後の帝国陸軍は、戦時動員の名残を抱えたまま巨大な制度へ成長した。将校団、参謀本部、兵站組織、予備役制度、軍需産業との結びつきは、帝国の安全保障を支える不可欠な柱である。一方で、その規模は平時財政にとって重すぎる負担となり、恐慌下の予算審議では常に争点となっている。保守派と軍部は、広大な帝国と欧州秩序を守るには強大な軍が必要だと主張する。対して財政官僚や議会派は、肥大化した軍事支出が社会政策と経済再建を圧迫していると批判している。軍隊は帝国の盾であると同時に、政治改革を阻む独自の権力でもある。"
 GER_veterans_association:"退役軍人協会"
 GER_veterans_association_desc:"大戦を生き延びた退役軍人たちは、各地で協会を組織し、帝国社会に強い影響力を持っている。彼らは戦友会、記念団体、相互扶助組織、政治的圧力団体として活動し、地方社会から帝国議会に至るまで無視できない存在となった。戦没者の記憶、勝利の誇り、前線で共有された犠牲の物語は、退役軍人協会に道徳的権威を与えている。多くの協会は皇帝と軍への忠誠を掲げ、愛国的な結束を支える一方、急進的な反革命運動や強硬な国家主義と結びつく危険も抱えている。彼らは帝国を安定させる支柱にもなり得るが、政治危機の中では街頭と議会をつなぐ動員装置にもなり得る。"
 BAY_bavarian_military_reserve:"バイエルン軍管区予備役"
 BAY_bavarian_military_reserve_desc:"バイエルンの中核州がドイツ帝国の領有下にある間、その地域の軍事行政はバイエルン王国の管区制度を通じて処理される。これにより、当該地域の自然人的増加の半分は毎月バイエルン軍の人的資源として登録される。"
 BAY_bavarian_military_reserve_monthly_effect_tt:"§Y毎月§!、ドイツが領有しているバイエルン中核州から以下の人的資源を追加で得る：\n §Yオーバーバイエルン§!: §G+1,675§!\n §Yニーダーバイエルン§!: §G+908§!\n §Yフランケン§!: §G+1,568§!\n対象州がドイツ領でなくなった場合、その州からの月次加算は停止する。"



